# Build check for pull requests — gate that dependency-bump PRs (Dependabot)
# don't break the build before they reach master. No deploy, no secrets.
name: CI

on:
  pull_request:
    # Include the ci-shard base for this stacked CI follow-up.
    # merge/** covers PRs stacked on another merge/ branch.
    branches: ["master", "merge/**", "ci-shard"]

# Read-only; a build needs nothing more (also what Dependabot PRs get by default)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: svelte-check
        run: npm run check

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test:unit

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # Must match package-lock.json's exact @playwright/test version.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
      volumes:
        # Mobile font tests need DejaVu Sans, present on the runner but not the image.
        - /usr/share/fonts/truetype/dejavu:/usr/share/fonts/truetype/dejavu:ro
    env:
      # WebKit needs a writable home when the container runs as root.
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - name: Verify Playwright container version
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const version = lock.packages['node_modules/@playwright/test'].version;
          const image = JSON.parse(fs.readFileSync('/ms-playwright/.docker-info', 'utf8'));
          const expected = `mcr.microsoft.com/playwright:v${version}-noble`;
          if (image.dockerImageName !== expected) {
            console.error(`::error::Playwright image ${image.dockerImageName} does not match @playwright/test ${version}. Update jobs.e2e.container.image to ${expected}.`);
            process.exit(1);
          }
          console.log(`Playwright container matches @playwright/test ${version}`);
          NODE
      - name: Verify DejaVu Sans test font
        run: |
          fc-cache -f /usr/share/fonts/truetype/dejavu
          if [ -z "$(fc-list 'DejaVu Sans' file)" ]; then
            echo "::error::Mobile tests require DejaVu Sans from the runner's font mount."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: E2E tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
      - name: Two-build upgrade tests (Chromium, mobile, WebKit)
        run: npm run test:upgrade -- --shard=${{ matrix.shard }}/4
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: playwright-report
          retention-days: 7

  test:
    needs: [unit, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Require unit tests and all e2e shards to succeed
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$E2E_RESULT" = success

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Lint changed files
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE"
          files=$(git diff --name-only --diff-filter=ACMR "origin/$BASE...HEAD" | grep -E '\.(js|svelte|json|css|html)$' || true)
          if [ -z "$files" ]; then
            echo "No lintable files changed; skipping."
            exit 0
          fi
          echo "Changed lintable files:"
          echo "$files"
          echo "$files" | xargs npx prettier --check
          eslint_files=$(echo "$files" | grep -E '\.(js|svelte)$' || true)
          if [ -z "$eslint_files" ]; then
            echo "No JS/Svelte files changed; skipping eslint."
            exit 0
          fi
          echo "$eslint_files" | xargs npx eslint
