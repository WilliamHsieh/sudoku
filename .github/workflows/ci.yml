# Build check for pull requests — gate that dependency-bump PRs (Dependabot)
# don't break the build before they reach master. No deploy, no secrets.
name: CI

on:
  pull_request:
    # merge/** covers PRs stacked on another merge/ branch
    branches: ["master", "merge/**"]

# Read-only; a build needs nothing more (also what Dependabot PRs get by default)
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: svelte-check
        run: npm run check

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Lint changed files
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE"
          files=$(git diff --name-only --diff-filter=ACMR "origin/$BASE...HEAD" | grep -E '\.(js|svelte|json|css|html)$' || true)
          if [ -z "$files" ]; then
            echo "No lintable files changed; skipping."
            exit 0
          fi
          echo "Changed lintable files:"
          echo "$files"
          echo "$files" | xargs npx prettier --check
          eslint_files=$(echo "$files" | grep -E '\.(js|svelte)$' || true)
          if [ -z "$eslint_files" ]; then
            echo "No JS/Svelte files changed; skipping eslint."
            exit 0
          fi
          echo "$eslint_files" | xargs npx eslint
