# Build check for pull requests — gate that dependency-bump PRs (Dependabot)
# don't break the build before they reach master. No deploy, no secrets.
name: CI

on:
  pull_request:
    # merge/** covers PRs stacked on another merge/ branch
    branches: ["master", "merge/**"]

# Read-only; a build needs nothing more (also what Dependabot PRs get by default)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: svelte-check
        run: npm run check

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test:unit

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        id: browser-install
        timeout-minutes: 5
        continue-on-error: true
        # The timeout needs root privileges to stop apt and release its locks.
        run: |
          sudo timeout --kill-after=10s 240s env "PATH=$PATH" \
            "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" \
            npx playwright install --with-deps chromium webkit
      - name: Retry Playwright browser installation
        if: steps.browser-install.outcome == 'failure'
        timeout-minutes: 5
        # The timeout needs root privileges to stop apt and release its locks.
        run: |
          sudo timeout --kill-after=10s 240s env "PATH=$PATH" \
            "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" \
            npx playwright install --with-deps chromium webkit
      - name: E2E tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report
          retention-days: 7

  test:
    needs: [unit, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Require unit tests and all e2e shards to succeed
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$E2E_RESULT" = success

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Lint changed files
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE"
          files=$(git diff --name-only --diff-filter=ACMR "origin/$BASE...HEAD" | grep -E '\.(js|svelte|json|css|html)$' || true)
          if [ -z "$files" ]; then
            echo "No lintable files changed; skipping."
            exit 0
          fi
          echo "Changed lintable files:"
          echo "$files"
          echo "$files" | xargs npx prettier --check
          eslint_files=$(echo "$files" | grep -E '\.(js|svelte)$' || true)
          if [ -z "$eslint_files" ]; then
            echo "No JS/Svelte files changed; skipping eslint."
            exit 0
          fi
          echo "$eslint_files" | xargs npx eslint
