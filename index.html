<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="%BASE_URL%favicon/I7-16.svg" />
    <link rel="icon" type="image/svg+xml" sizes="16x16" href="%BASE_URL%favicon/I7-16.svg" />
    <link rel="icon" type="image/svg+xml" sizes="32x32" href="%BASE_URL%favicon/I7-32.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="theme-color" content="#f5f4f0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sudoku" />
    <!-- Let iOS paint the status bar and lay out the page below it. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Runs even when an update's module cannot load. No storage is needed.
      const updateUrl = new URL(location.href);
      if (updateUrl.searchParams.has("_sudoku_update")) {
        updateUrl.searchParams.delete("_sudoku_update");
        history.replaceState(history.state, "", updateUrl);
        setTimeout(() => {
          const app = document.getElementById("app");
          if (!app.hasChildNodes()) {
            const retry = document.createElement("a");
            retry.href = updateUrl.href;
            retry.textContent = "Reload Sudoku";
            retry.addEventListener("click", (event) => {
              event.preventDefault();
              location.reload();
            });
            app.append(retry);
          }
        }, 6000);
      }
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
