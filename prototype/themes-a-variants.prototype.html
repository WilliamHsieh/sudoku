<!doctype html>

<html lang="zh-Hant">
<head>

<style>

[data-theme="A2"]{--page:#24272c;--board:#2c3037;--given:#393e47;--ink:#f3f4f7;--soft:#bec5d0;--note:#c2cad6;--answer:#93d2ff;--line:#4d5868;--major:#74859e;--outer:#8092ac;--frame:#37404c;--control-line:#424c5b;--select-bg:#315175;--select-ring:#9ac6fc;--match-bg:#64532c;--match-ink:#ffe8b1;--chip-bg:#e8c878;--chip-ink:#352810;--error-bg:#64333d;--error:#ffb0bd;--cue-bg:#304e40;--cue:#9cdeb6;--key:#353c46;--key-line:#4a5666;--active-ink:#1c2d44;}

[data-theme="A4"]{--page:#1d1c1b;--board:#262524;--given:#353330;--ink:#f3f0e9;--soft:#bfb9b0;--note:#c7bfb4;--answer:#94cefa;--line:#4b4945;--major:#787973;--outer:#898b83;--frame:#343330;--control-line:#403e38;--select-bg:#2d4661;--select-ring:#93c3f5;--match-bg:#5b4a26;--match-ink:#f5d994;--chip-bg:#e3c16b;--chip-ink:#30250d;--error-bg:#563031;--error:#f5a6a4;--cue-bg:#2e4234;--cue:#a2d2ac;--key:#302f2c;--key-line:#47453f;--active-ink:#172a40;}
.comparison-controls{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 14px}.current-name{font-size:12px;font-weight:500}.scenario{display:flex;border:1px solid var(--frame);padding:3px;border-radius:8px;background:var(--page)} .scenario button{padding:6px 12px;border:0;border-radius:5px;background:transparent;color:var(--soft);font-size:11px}.scenario button[aria-pressed=true]{background:var(--key);color:var(--ink)}
.stage{max-width:472px;margin:0 auto;padding:16px;background:var(--page);color:var(--ink);border:1px solid var(--frame);border-radius:var(--radius);--primary:var(--select-ring)}.header{display:flex;align-items:center;justify-content:space-between;height:54px;gap:12px;margin-bottom:14px}.date-button{display:flex;align-items:center;gap:10px;min-width:0}.calendar{width:38px;height:38px;background:var(--key);border:1px solid var(--control-line);border-radius:10px;display:grid;place-items:center;color:var(--soft)}.date-text{display:flex;flex-direction:column;gap:5px}.date-text strong{font-size:14px;font-weight:600}.date-text small{font-size:11px;color:var(--soft);display:flex;align-items:center;gap:6px}.diff-dot{height:5px;width:5px;background:var(--match-ink);border-radius:50%} .timer{border:1px solid var(--control-line);border-radius:24px;color:var(--ink);background:var(--key);display:flex;align-items:center;gap:10px;padding:10px 11px;font-size:13px;font-variant-numeric:tabular-nums}.timer svg{width:13px;height:13px}.board-wrap{position:relative}.board{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));grid-template-rows:repeat(9,minmax(0,1fr));aspect-ratio:1;border:3px solid var(--outer);border-radius:6px;overflow:hidden;background:var(--board);container-type:inline-size}.cell{position:relative;min-width:0;min-height:0;padding:0;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--board);color:var(--answer);display:grid;place-items:center;font-size:clamp(20px,6cqw,29px);line-height:1;font-weight:400;font-variant-numeric:tabular-nums}.cell.given{background:var(--given);color:var(--ink);font-weight:700}.cell.box-right{border-right:3px solid var(--major)}.cell.box-bottom{border-bottom:3px solid var(--major)}.cell:nth-child(9n){border-right:0}.cell:nth-child(n+73){border-bottom:0}.cell.match{background:var(--match-bg)}.cell.match:not(.given){color:var(--match-ink)}.cell.selected{background:var(--select-bg);box-shadow:inset 0 0 0 2px var(--select-ring);z-index:1}.cell.cue{background:var(--cue-bg);box-shadow:inset 0 0 0 2px var(--cue);z-index:1}.cell.conflict{background:var(--error-bg);color:var(--error)}.cell.conflict:after{content:"";position:absolute;bottom:5px;left:32%;right:32%;height:2px;background:var(--error);border-radius:2px}.cell:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--select-ring);z-index:2}.notes{position:absolute;inset:3px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);color:var(--note);font-size:clamp(8px,2.7cqw,12px);line-height:1}.notes span{display:grid;place-items:center}.notes .note-match{background:var(--chip-bg);color:var(--chip-ink);border-radius:3px}.cue .notes{color:var(--cue);font-weight:700}.cue .note-match{background:transparent;color:var(--cue)}.pause-cover{position:absolute;inset:0;z-index:3;background:var(--page);border:3px solid var(--major);border-radius:6px;display:grid;place-content:center;text-align:center;gap:18px}.pause-cover[hidden]{display:none}.pause-cover strong{font-size:23px;font-weight:500}.pause-cover button{padding:11px 24px;border:0;border-radius:10px;background:var(--select-ring);color:var(--active-ink)}.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0}.tool{border:0;border-radius:10px;padding:7px 2px;background:transparent;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px}.tool:disabled{opacity:.35;cursor:default}.tool[aria-pressed=true]{background:var(--select-bg);color:var(--select-ring)}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.key{height:60px;padding:0;border:1px solid var(--key-line);border-radius:12px;box-shadow:0 1px 2px color-mix(in srgb,var(--page) 65%,transparent);background:var(--key);color:var(--ink);font:30px Verdana,sans-serif}.key[aria-pressed=true]{border-color:var(--chip-bg);box-shadow:inset 0 0 0 1px var(--chip-bg);background:var(--match-bg);color:var(--match-ink)}.hint{margin:13px 0 1px;text-align:center;font-size:11px;line-height:1.5;color:var(--soft);min-height:17px}.caption{margin:15px 0 14px;font-size:12px;color:var(--muted);line-height:1.7}.caption strong{color:var(--foreground);font-weight:550}.legend{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 16px;padding:16px;background:var(--page);border:1px solid var(--frame);border-radius:var(--radius);color:var(--ink)}.legend-item{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;color:var(--soft)}.sample{width:44px;height:42px;border:1px solid var(--line);border-radius:4px;display:grid;place-items:center;background:var(--board);color:var(--ink);font-size:24px;font-weight:400}.sample.given{background:var(--given);font-weight:700}.sample.answer{color:var(--answer)}.sample.selected{background:var(--select-bg);box-shadow:inset 0 0 0 2px var(--select-ring);color:var(--ink)}.sample.match{background:var(--match-bg);color:var(--match-ink)}.sample.pencil{font-size:12px;letter-spacing:3px;color:var(--note)}.sample.chip span{font-size:13px;width:19px;height:19px;display:grid;place-items:center;border-radius:3px;background:var(--chip-bg);color:var(--chip-ink)}.sample.cue{background:var(--cue-bg);box-shadow:inset 0 0 0 2px var(--cue);color:var(--cue);font-size:13px}.sample.error{background:var(--error-bg);color:var(--error);text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:2px}.switcher{position:sticky;bottom:8px;display:flex;align-items:center;gap:6px;padding:4px;width:max-content;max-width:100%;margin:16px auto 0;border:1px solid var(--frame);border-radius:32px;background:var(--page);color:var(--ink);box-shadow:0 5px 20px #0003;z-index:5} .switcher button{width:34px;height:30px;border:0;border-radius:50%;color:var(--ink);background:transparent;font-size:18px}.switcher button:hover{background:var(--key)}#variant-label{min-width:155px;text-align:center;font-size:11px}.state{font-size:10px;color:var(--muted);margin:12px 0 0;line-height:1.6}
@media(max-width:480px){.choices{gap:5px}.choice{padding:9px 5px}.choice strong{font-size:10px}.choice small{font-size:8px}.swatches{gap:2px}.swatches i{width:9px;height:11px;border-radius:2px}.intro small{font-size:9px}.intro strong{font-size:12px}.stage{padding:10px}.date-text strong{font-size:12px}.calendar{width:32px;height:34px}.date-button{gap:7px}.timer{padding:9px 10px;gap:7px}.header{margin-bottom:10px}.notes{inset:2px}.key{height:55px}.legend{gap:12px 5px;padding:14px 9px}.legend-item{font-size:10px}.caption{font-size:11px}.comparison-controls{gap:5px}.current-name{font-size:11px}.scenario button{font-size:10px;padding:6px 10px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="study">
<div class="intro"><strong>A 系列 · 固定版型，細調配色</strong><small>原版＋4 款細調</small></div>
<nav class="choices" aria-label="主題配色"></nav>
<div class="comparison-controls" data-theme="A1"><span class="current-name" id="current-name"></span><div class="scenario" aria-label="預覽狀態"><button data-scenario="normal" aria-pressed="true">解題中</button><button data-scenario="conflict" aria-pressed="false">衝突</button><button data-scenario="cue" aria-pressed="false">唯一候選</button></div></div>
<section class="stage" data-theme="A1" aria-label="數獨主題預覽">
<header class="header"><div class="date-button"><span class="calendar" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 11h18M8 15h2M14 15h2"/></svg></span><span class="date-text"><strong>Fri, Oct 30</strong><small><i class="diff-dot"></i>Medium</small></span></div><button class="timer" id="pause" aria-label="暫停預覽"><span>08:24</span><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke-width="3"/></svg></button></header>
<div class="board-wrap"><div class="board" aria-label="數獨棋盤"></div><div class="pause-cover" hidden><strong>Paused</strong><button id="resume">Resume</button></div></div>
<div class="tools" aria-label="工具列"><button class="tool" id="reset" aria-label="重設預覽"><svg viewBox="0 0 24 24"><path d="m9 4-5 5 5 5M4 9h10a6 6 0 0 1 0 12"/></svg><span>Undo</span></button><button class="tool" data-unavailable disabled><svg viewBox="0 0 24 24"><path d="m15 4 5 5-5 5M20 9H10a6 6 0 0 0 0 12"/></svg><span>Redo</span></button><button class="tool" id="clear"><svg viewBox="0 0 24 24"><path d="m4 13 9-9 7 7-9 9H8l-5-5zM9 8l7 7M11 20h10"/></svg><span>Erase</span></button><button class="tool" id="notes" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="m15 4 5 5M4 20l4-1L21 6l-4-4L4 15z"/></svg><span>Notes</span></button><button class="tool" id="more" aria-label="切換衝突預覽" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg><span>More</span></button></div>
<div class="keypad" aria-label="數字醒目提示"></div>
<p class="hint">Tap a number to highlight matching cells.</p>
</section>
<p class="caption"><strong id="theme-title"></strong><br><span id="theme-description"></span></p>
<section class="legend" data-theme="A1" aria-label="功能顏色對照">
<div class="legend-item"><span class="sample given">8</span><span>題目數字</span></div><div class="legend-item"><span class="sample answer">4</span><span>我的填答</span></div><div class="legend-item"><span class="sample selected">4</span><span>目前選取</span></div><div class="legend-item"><span class="sample match">5</span><span>相同數字</span></div><div class="legend-item"><span class="sample pencil">2 7</span><span>候選筆記</span></div><div class="legend-item"><span class="sample chip"><span>5</span></span><span>符合的候選</span></div><div class="legend-item"><span class="sample cue">5</span><span>唯一候選</span></div><div class="legend-item"><span class="sample error">5</span><span>數字衝突</span></div>
</section>
<p class="state" aria-live="polite"></p>
<nav class="switcher" data-theme="A1" aria-label="切換主題"><button id="previous" aria-label="上一款">←</button><span id="variant-label"></span><button id="next" aria-label="下一款">→</button></nav>
</main>
<script>
const themes=[{"id":"A0","name":"原版","en":"Original","kind":"BASE","description":"保留目前 A：石墨灰底、冰藍填答、金色提示。"},{"id":"A1","name":"深石墨","en":"Deep","kind":"DARK","description":"底色更深、選取更明確；線條保持收斂。"},{"id":"A2","name":"霧面灰","en":"Matte","kind":"DARK","description":"灰階提亮，筆記與題目格的層次更清楚。"},{"id":"A3","name":"低彩度","en":"Muted","kind":"DARK","description":"降低藍金飽和度，讓功能色保留辨識度。"},{"id":"A4","name":"暖石墨","en":"Warm","kind":"DARK","description":"底色與邊線微暖，維持藍色選取與金色追蹤。"}];
const puzzle='530070000600195000098000060800060003400803001700020006060000280000419005000080079';
const solution='534678912672195348198342567859761423426853791713924856961537284287419635345286179';
const values=puzzle.split('').map(Number);[2,3,5,6,8].forEach(i=>values[i]=Number(solution[i]));
const board=document.querySelector('.board');
let selected=30,digit=5,showNotes=true,paused=false,scenario='normal';
let current=Math.max(0,themes.findIndex(t=>t.id===(new URLSearchParams(location.search).get('variant')||'A1').toUpperCase()));
function candidates(index){const row=Math.floor(index/9),col=index%9;return Array.from({length:9},(_,i)=>i+1).filter(n=>!values.some((v,j)=>v===n&&(Math.floor(j/9)===row||j%9===col||(Math.floor(j/27)===Math.floor(row/3)&&Math.floor(j%9/3)===Math.floor(col/3)))));}
function renderBoard(){
board.innerHTML=values.map((value,i)=>{const n=scenario==='conflict'&&i===11?5:value;const fixed=puzzle[i]!=='0',notes=candidates(i);const conflict=scenario==='conflict'&&(i===0||i===11||i===14);const cue=scenario==='cue'&&i===40;
const classes=['cell',fixed?'given':'',n&&n===digit?'match':'',i===selected?'selected':'',conflict?'conflict':'',cue?'cue':'',i%9===2||i%9===5?'box-right':'',Math.floor(i/9)===2||Math.floor(i/9)===5?'box-bottom':''].join(' ');
const pencil=!n&&(showNotes||cue)?`<span class="notes">${Array.from({length:9},(_,j)=>`<span class="${notes.includes(j+1)&&j+1===digit?'note-match':''}">${notes.includes(j+1)?j+1:''}</span>`).join('')}</span>`:'';
return `<button class="${classes}" data-cell="${i}" aria-label="第 ${Math.floor(i/9)+1} 列，第 ${i%9+1} 欄，${n||'空格'}${fixed?'，題目數字':''}${conflict?'，衝突':''}${cue?'，唯一候選':''}" aria-pressed="${i===selected}">${n||''}${pencil}</button>`;
}).join('');
document.querySelectorAll('.key').forEach(el=>el.setAttribute('aria-pressed',String(Number(el.dataset.digit)===digit)));
document.querySelector('.state').textContent=`視覺 mock · 同一題目、同一版型 · R${Math.floor(selected/9)+1}C${selected%9+1} · 提示 ${digit||'無'} · 筆記${showNotes?'開':'關'} · ${paused?'已暫停':scenario==='conflict'?'衝突預覽':scenario==='cue'?'唯一候選預覽':'解題預覽'}`;
}
function selectTheme(index,updateUrl=true){current=(index+themes.length)%themes.length;const theme=themes[current];document.querySelector('.stage').dataset.theme=theme.id;document.querySelector('.legend').dataset.theme=theme.id;document.querySelector('.comparison-controls').dataset.theme=theme.id;document.querySelector('.switcher').dataset.theme=theme.id;document.querySelectorAll('.choice').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.theme===theme.id)));document.querySelector('#current-name').textContent=`${theme.id} · ${theme.name}`;document.querySelector('#theme-title').textContent=`${theme.en} / ${theme.name}`;document.querySelector('#theme-description').textContent=theme.description;document.querySelector('#variant-label').textContent=`${theme.id} · ${theme.name}`;if(updateUrl){try{const url=new URL(location.href);url.searchParams.set('variant',theme.id);history.replaceState(null,'',url);}catch{/* Sandboxed embeds may disallow history writes. */}}}
function setScenario(next){scenario=next;document.querySelectorAll('[data-scenario]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.scenario===next)));document.querySelector('#more').setAttribute('aria-pressed',String(next==='conflict'));renderBoard();}
function setPaused(next){paused=next;board.inert=next;document.querySelector('.pause-cover').hidden=!next;document.querySelector('#pause').setAttribute('aria-label',next?'繼續預覽':'暫停預覽');document.querySelectorAll('.tools button:not([data-unavailable]),.key').forEach(el=>el.disabled=next);renderBoard();}
document.querySelector('.choices').innerHTML=themes.map(t=>`<button class="choice" data-theme="${t.id}" aria-pressed="false"><strong>${t.id} ${t.name}</strong><span class="swatches" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><small>${t.kind}</small></button>`).join('');
document.querySelector('.keypad').innerHTML=Array.from({length:9},(_,i)=>`<button class="key" data-digit="${i+1}" aria-label="醒目提示數字 ${i+1}" aria-pressed="false">${i+1}</button>`).join('');
document.querySelector('.choices').onclick=e=>{const button=e.target.closest('.choice');if(button)selectTheme(themes.findIndex(t=>t.id===button.dataset.theme));};
document.querySelector('.scenario').onclick=e=>{const button=e.target.closest('[data-scenario]');if(button)setScenario(button.dataset.scenario);};
document.querySelector('#previous').onclick=()=>selectTheme(current-1);document.querySelector('#next').onclick=()=>selectTheme(current+1);
board.onclick=e=>{const button=e.target.closest('[data-cell]');if(!button||paused)return;selected=Number(button.dataset.cell);renderBoard();};
document.querySelector('.keypad').onclick=e=>{const button=e.target.closest('[data-digit]');if(!button||paused)return;digit=digit===Number(button.dataset.digit)?0:Number(button.dataset.digit);renderBoard();};
document.querySelector('#notes').onclick=()=>{if(paused)return;showNotes=!showNotes;document.querySelector('#notes').setAttribute('aria-pressed',String(showNotes));renderBoard();};
document.querySelector('#clear').onclick=()=>{if(paused)return;digit=0;renderBoard();};
document.querySelector('#reset').onclick=()=>{if(paused)return;selected=30;digit=5;showNotes=true;document.querySelector('#notes').setAttribute('aria-pressed','true');setScenario('normal');};
document.querySelector('#more').onclick=()=>setScenario(scenario==='conflict'?'normal':'conflict');
document.querySelector('#pause').onclick=()=>setPaused(!paused);document.querySelector('#resume').onclick=()=>setPaused(false);
document.addEventListener('keydown',e=>{if((e.target instanceof Element&&e.target.closest('input,textarea,select,[contenteditable="true"]'))||e.metaKey||e.ctrlKey||e.altKey)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();selectTheme(current+(e.key==='ArrowRight'?1:-1));}});
window.addEventListener('popstate',()=>{const id=(new URLSearchParams(location.search).get('variant')||'A1').toUpperCase();selectTheme(Math.max(0,themes.findIndex(t=>t.id===id)),false);});
selectTheme(current,false);renderBoard();
</script>
</body>
</html>
